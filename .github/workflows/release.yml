name: Release

# Push a tag like v0.1.0 to build installers on macOS, Windows and Linux
# and publish them on a GitHub Release. "Run workflow" builds without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, flag: --mac, files: 'dist/*.dmg' }
          - { name: Windows, os: windows-latest, flag: --win, files: 'dist/*.exe' }
          - { name: Linux, os: ubuntu-latest, flag: --linux, files: 'dist/*.AppImage' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build installers
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "fivehour $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
